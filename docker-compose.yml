version: '3.9'

services:
  # -------------------------------------------------------------
  # 1. SENSORIUM Sovereign Core App (Node 22 + Vite + WebSockets)
  # -------------------------------------------------------------
  sensorium-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sensorium-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://sensorium_user:sensorium_secret_2026@postgres:5432/sensorium_db?schema=public
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sensorium-network

  # -------------------------------------------------------------
  # 2. Base de Données Relationnelle Isolée PostgreSQL
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sensorium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sensorium_user
      POSTGRES_PASSWORD: sensorium_secret_2026
      POSTGRES_DB: sensorium_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensorium_user -d sensorium_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sensorium-network

  # -------------------------------------------------------------
  # 3. Cache Mémoire & WAF Blacklist Redis
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sensorium-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sensorium-network

  # -------------------------------------------------------------
  # 4. Observabilité Prometheus (Scraping /metrics)
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sensorium-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - sensorium-network

  # -------------------------------------------------------------
  # 5. Visualisation & Cockpit Grafana
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: sensorium-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_sensorium_2026
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sensorium-network

networks:
  sensorium-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
