version: "3.8"

services:
  # ==========================================
  # BUS INTERNE DE HAUTE DISPONIBILITÉ (KAFKA)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sensorium_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sensorium_isolated_mesh

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sensorium_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - sensorium_isolated_mesh

  # ==========================================
  # COUCHE PASSERELLE & REFLEXE : GO GATEWAYS
  # ==========================================
  go_gateways:
    build:
      context: ./server
      dockerfile: Dockerfile.go
    container_name: sensorium_go_gateways
    depends_on:
      - kafka
      - python_neural_core
    ports:
      - "8080:8080" # Point d'entrée de l'IDE / API Rest & Flux Socket.IO
    environment:
      - KAFKA_BROKER=kafka:29092
      - TELEMETRY_TOPIC=telemetry.rackB.thermal
      - NEURAL_CORE_URL=http://python_neural_core:5000
      - WIREGUARD_INTERFACE=wg0
    volumes:
      - dora_compliance_vault:/var/log/sensorium/audit
    networks:
      - sensorium_isolated_mesh
    restart: unless-stopped

  # ==========================================
  # COUCHE LE CERVEAU : PYTHON NEURAL CORE (ENCLAVE IA & HSM)
  # ==========================================
  python_neural_core:
    build:
      context: ./server/neural_core
      dockerfile: Dockerfile.python
    container_name: sensorium_neural_core
    environment:
      - ENV=PRODUCTION
      - HSM_SECRET_KEY=SENSORIUM_HW_SECRET_ROOT_DORA_COMPLIANT_2026
      - FLASK_RUN_PORT=5000
    volumes:
      - ./server/neural_core/topology.json:/app/topology.json:ro # Graphe topologique immuable au runtime
    networks:
      - sensorium_isolated_mesh
    restart: unless-stopped

# ==========================================
# ESPACES DE STOCKAGE & CHIFFREMENT RESEAU
# ==========================================
volumes:
  dora_compliance_vault:
    name: sensorium_dora_compliance_vault
    driver: local

networks:
  sensorium_isolated_mesh:
    name: sensorium_isolated_mesh
    driver: bridge
    ipam:
      config:
        - subnet: 10.26.0.0/16 # Zone réseau souveraine dédiée
