<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E1E24" />
      <stop offset="50%" stopColor="#0E0E12" />
      <stop offset="100%" stopColor="#050507" />
    </linearGradient>
    <linearGradient id="sensoriumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="40%" stopColor="#F5D061" />
      <stop offset="100%" stopColor="#E5A93B" />
    </linearGradient>
    <radialGradient id="sensorCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFF1B8" />
      <stop offset="60%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#B45309" />
    </radialGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
  <rect x="2" y="2" width="60" height="28" rx="16" fill="white" fill-opacity="0.05" />

  <!-- Hexagonal Quantum Shield boundary scaled to 64x64 -->
  <path 
    d="M32 10L52 21.5V44.5L32 56L12 44.5V21.5L32 10Z" 
    stroke="url(#sensoriumGold)" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Tri-Orbital Sensory Waves -->
  <circle cx="32" cy="33" r="14" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="32" cy="33" r="8.5" stroke="url(#sensoriumGold)" stroke-width="2" />

  <!-- Central Sensory Nucleus -->
  <circle cx="32" cy="33" r="4.5" fill="url(#sensorCoreGlow)" />

  <!-- Micro Precision Sensor Nodes -->
  <circle cx="32" cy="16.5" r="2.2" fill="#FFFFFF" />
  <circle cx="46.5" cy="41.5" r="2.2" fill="#FFFFFF" />
  <circle cx="17.5" cy="41.5" r="2.2" fill="#FFFFFF" />
</svg>
